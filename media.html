<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>

<main>
<h1>Heatwave Media & Awareness</h1>
<hr>

<div class="section">
<h2>Heatwave Awareness Video</h2>
<video width="700" controls>
    <source src="heatwave.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>
</div>

<div class="section">
<h2>Background Audio Advisory</h2>
<audio controls autoplay loop>
    <source src="advisory.mp3" type="audio/mpeg">
    Your browser does not support the audio tag.
</audio>
</div>

<div class="section">
<h2>Photo Gallery &mdash; Field Monitoring</h2>
<div class="gallery">
    <figure>
        <img src="images (1).jpg" alt="IMD monitoring station">
        <figcaption>IMD Monitoring Station</figcaption>
    </figure>
    <figure>
        <img src="hotspot map.png" alt="Regional hotspot map">
        <figcaption>Regional Hotspot Map</figcaption>
    </figure>
    <figure>
        <img src="images (1).jpg" alt="AWS sensor unit">
        <figcaption>AWS Sensor Unit</figcaption>
    </figure>
    <figure>
        <img src="hotspot map.png" alt="Satellite overlay">
        <figcaption>Satellite Overlay</figcaption>
    </figure>
</div>
</div>

<div class="section">
<h2>Heatwave Monitoring Location</h2>
<iframe
    src="https://www.google.com/maps?q=India&output=embed"
    width="700"
    height="450"
    loading="lazy">
</iframe>
</div>

<div class="section">
<h2>India Meteorological Department</h2>
<iframe
    src="https://mausam.imd.gov.in/"
    width="700"
    height="450">
</iframe>
</div>
